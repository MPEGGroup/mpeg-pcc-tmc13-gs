# Test conditions for N17995 CTC C1 using TMC13 octree
# octree lossless-geom  --  lossy-attrs liftt
---
categories:
  lossless-geom-lossy-attrs:
    encflags:
     - mode: 0
     -
       - !conditional '"${group}" =~ m{^catGS}'
       - mainProfileCompliant: 0
       - gsProfileCompliant: 1
       - ""

     -
       - !conditional '${src-unit-metres}'
       - srcUnit: metre
       - srcUnitLength: '${src-unit-metres}'
       - outputUnitLength: '${src-unit-metres}'

     ##
     # geometry parameters (octree)
     #  - preserve lossless geometry property
     - trisoupNodeSizeLog2: 0
     - mergeDuplicatedPoints: 0
     - positionQuantizationScale: 1
     -
       - neighbourAvailBoundaryLog2: 8
       - intra_pred_max_node_size_log2: 6
       -
         - !conditional '${numLasers}'
         - angularEnabled: 1
         - numLasers: '${numLasers}'
         - lasersTheta: '${lasersTheta}'
         - lasersZ: '${lasersZ}'
         - lasersNumPhiPerTurn:  '${lasersNumPhiPerTurn}'
         - planarBufferDisabled: 1

       # idcm intensity depends upon the content type
       - inferredDirectCodingMode: 1
       -
         - !conditional '"${group}" eq "cat3-fused"'
         - inferredDirectCodingMode: 2
       -
         - !conditional '"${group}" eq "cat3-frame"'
         - inferredDirectCodingMode: 3
       -
         - !conditional '"${group}" =~ m{^catGS}'
         - inferredDirectCodingMode: 3

       # default qtbt and planar with cat3-frame exception
       - maxNumQtBtBeforeOt: 4
       - minQtbtSizeLog2: 0
       - planarEnabled: 1
       - planarModeIdcmUse: 0
       -
         - !conditional '"${group}" eq "cat3-frame"'
         - partitionMethod: 0
         - maxNumQtBtBeforeOt: 6
         - planarModeIdcmUse: 32
     -
       - !conditional '"${group}" =~ m{^catGS}'
       - neighbourAvailBoundaryLog2: 0
       - intra_pred_max_node_size_log2: 0
       - planarEnabled: 0
       - qtbtEnabled: 0
       - planarModeIdcmUse: 0

     ####
     # attribute coding (common options -- relies on option ordering)
     #  - use lifting transform for lossy conditions
     #  - scale 16bit reflectance data to 8bit
     - convertPlyColourspace: 1
     - transformType: 2
     - numberOfNearestNeighborsInPrediction: 3
     - levelOfDetailCount: '$eval{ ${seq_lod} || 12 }'
     - lodDecimator: 0
     -
       - !conditional '"${group}" =~ m{^cat3}'
       - lodDecimator: 1
       - lod_neigh_bias: ${seq_lod_bias}
     -
       - !conditional '"${group}" =~ m{^catGS}'
       - lodDecimator: 1
       - intraLodPredictionSkipLayers: 0
     -
       - !conditional '${numLasers}'
       - lod_neigh_bias: '1,1,1'
       - spherical_coord_flag: 1

     ##
     # attribute coding -- reflectance
     -
       - !conditional '${has_refl}'
       - adaptivePredictionThreshold: 64
       - qp:
           r01: 51
           r02: 46
           r03: 40
           r04: 34
           r05: 28
           r06: 22
       - bitdepth: 8
       -
         - !conditional '${reflectance8b16b_scale_factor}'
         - attrOffset: 0
         - attrScale: ${reflectance8b16b_scale_factor}
       - attribute: reflectance

     ##
     # attribute coding -- colour
     -
       - !conditional '${has_colour}'
       - adaptivePredictionThreshold: 64
       - qp:
           r01: 51
           r02: 46
           r03: 40
           r04: 34
           r05: 28
           r06: 22
       - qpChromaOffset: 0
       - bitdepth: 8
       - attrOffset: 0
       - attrScale: 1
       - attribute: color
     -
       - !conditional '"${group}" =~ m{^catGS}'
       - intraLodPredictionSkipLayers: 0
       - convertPlyColourspace: 1
       - transformType: 0
       - rahtPredictionEnabled: 0
       - outputBinaryPly: 1
       - inputScale: 2097152 # 2^21
       - sequenceScale: 1
       - externalScale: 0
       - geomMinMaxBitDepth: '${geomBD}'
       - maxRahtPrecisionDerivationEnabled: 1
       - attrFracBits: 12
       - "# All attributes have the same bitdepth"
       - bitdepth: 12
       - calcQPLayerOffsetsEnabled: 0
       - refResolutionWidth: '${width}' 
       - refResolutionHeight: '${height}' 
       - numSHCoeffBandsMinus1: 3
       - "# SH pre-/post-processing parameters ----------"  
       - gsdTransform2dPresentFlag: 1 
       - dataAdaptiveShTransform: 1
       - enableGsdPcaDc: 1
       - enableShNonUniformQuantization: 1
       - shNqRangeMode: 0 
       - shAdaptiveTpOpt: 1
       - attr_ac_scaling_enabled_flag: 1
       - shLowVarPca: 1
       - "# ---------------------------------------------"  
       - raht_adaptive_block_size_enabled: 1
       - attrScaleNonUniformQuantEnabled: 1
       - colourMatrix: 1
       - ""
       - "# Opacity ----------"
       - transformType: 1
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - attribute: opacity

       - ""
       - "# Scale ------------"
       - qp:
           r01: 38
           r02: 30
           r03: 22
           r04: 14
       - qpChromaOffset: 0
       - attribute: scale

       - ""
       - "# Rotation ---------"
       - qp:
           r01: 38
           r02: 30
           r03: 22
           r04: 14
       - qpChromaOffset: 0
       - rotationLabel: 0
       - attribute: rotationXYZ
       - ""
       - "# SH coefficients : band 0 (DC) ----------"
       - transformType: 0
       - qp:
           r01: 26
           r02: 18
           r03: 10
           r04: 6
       - qpChromaOffset:
           r01: 4
           r02: 4
           r03: 4
           r04: 2
       - shCoefficientLabel: 0
       - attribute: SHCoefficient0

       - ""
       - "# SH coefficients : band 1 (AC) ----------"
       - qp:
           r01: 38
           r02: 30
           r03: 22
           r04: 14
       - qpChromaOffset: 4
       - shCoefficientLabel: 1
       - attribute: SHCoefficient1
       - qp:
           r01: 38
           r02: 30
           r03: 22
           r04: 14
       - qpChromaOffset: 4
       - shCoefficientLabel: 2
       - attribute: SHCoefficient2
       - qp:
           r01: 38
           r02: 30
           r03: 22
           r04: 14
       - qpChromaOffset: 4
       - shCoefficientLabel: 3
       - attribute: SHCoefficient3

       - ""
       - "# SH coefficients : band 2 (AC) ----------"
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - qpChromaOffset: 4
       - shCoefficientLabel: 4
       - attribute: SHCoefficient4
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - qpChromaOffset: 4
       - shCoefficientLabel: 5
       - attribute: SHCoefficient5
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - qpChromaOffset: 4
       - shCoefficientLabel: 6
       - attribute: SHCoefficient6
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - qpChromaOffset: 4
       - shCoefficientLabel: 7
       - attribute: SHCoefficient7
       - qp:
           r01: 46
           r02: 38
           r03: 30
           r04: 22
       - qpChromaOffset: 4
       - shCoefficientLabel: 8
       - attribute: SHCoefficient8

       - ""
       - "# SH coefficients : band 3 (AC) ----------"
       - transformType: 2
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 9
       - attribute: SHCoefficient9
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 10
       - attribute: SHCoefficient10
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 11
       - attribute: SHCoefficient11
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 12
       - attribute: SHCoefficient12
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 13
       - attribute: SHCoefficient13
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 14
       - attribute: SHCoefficient14
       - qp:
           r01: 49
           r02: 41
           r03: 33
           r04: 25
       - qpChromaOffset: 4
       - shCoefficientLabel: 15
       - attribute: SHCoefficient15

       - ""
       - "# Frame index ---------"
       - attrFracBits: 0
       - attrOffset: 0
       - attrScale: 1
       - transformType: 1
       - qp: 4
       - bitdepth: 8
       - attribute: frame_index

    decflags:
     - mode: 1
     -
       - !conditional '${src-unit-metres}'
       - outputUnitLength: '${src-unit-metres}'
     -
       - !conditional '"${group}" !~ m{^catGS}'
       - convertPlyColourspace: 1
     -
       - !conditional '"${group}" =~ m{^catGS}'
       - convertPlyColourspace: 1
       - outputBinaryPly: 1

    pcerrorflags:
     - dropdups: 2
     - neighborsProc: 1

    sequences:
      # cat3
      citytunnel_q1mm:
