# Default configuration for preprocess_rdo.py (tmc3-style `key: value`).
#
# - One `key: value` per line; text after `#` is a comment.
# - Nested options use dotted keys, e.g. `trainer.lr-scale`.
# - Booleans use explicit `True` / `False`.
# - Command-line arguments override the values set here.

# Run RDO fine-tuning.
use-rdo: True # Set to False to skip fine-tuning and pruning (e.g., sanity check).

# Quantizer ----------
quantizer.position-bitdepth: 18

# Trainer ----------
trainer.max-steps: 10_000 # Set to 0 to skip fine-tuning (e.g., pruning only).
trainer.lr-scale: 0.1
trainer.neighbor-loss-weight: 5e-10

# Pruner ----------
pruner.mode: gscm
pruner.prune-ratio: 0.3 # Set to 0 to skip pruning (e.g., fine-tuning only).

# Number of workers (Change as needed) ----------
trainer.n-train-workers: 8
trainer.n-val-workers: 1
dataset.n-cache-workers: 8
pruner.n-gscm-workers: 0   # importance-scores OpenMP threads (0 = auto = all physical CPUs; reduce if segfault)


# Grid-search overrides
trainer.neighbor-loss-weight: 5e-10
trainer.lr-scale: 0.5
pruner.prune-ratio: 0.7
